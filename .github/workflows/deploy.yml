name: Build and deploy

# Builds the static site on every push to master and publishes the generated dist/ folder
# to the "deploy" branch. That branch is served by GitHub Pages (Settings → Pages → branch "deploy", folder "/")
# and can also be pulled by Hostinger (hPanel → Websites → Git, branch "deploy", install path public_html).
#
# The base path / site URL come from src/data/site.json (basePath "/mynewspaper" for the GitHub Pages
# project site). For a custom domain or Hostinger root hosting set basePath to "" and url to your domain,
# or override per build with the SITE_URL and BASE_PATH environment variables below.
#
# Optional: add a repository secret HOSTINGER_DEPLOY_WEBHOOK with the "Auto deployment" webhook
# URL from hPanel so Hostinger pulls the new build immediately instead of waiting for a manual pull.

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      HOSTINGER_DEPLOY_WEBHOOK: ${{ secrets.HOSTINGER_DEPLOY_WEBHOOK }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build
        # Uncomment to override src/data/site.json for this host:
        # env:
        #   SITE_URL: https://www.yourdomain.com
        #   BASE_PATH: ''

      - name: Check links and HTML
        run: npm run check

      - name: Publish dist/ to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: deploy
          force_orphan: true
          # Keep dotfiles such as .htaccess
          exclude_assets: ''
          user_name: github-actions[bot]
          user_email: 41898282+github-actions[bot]@users.noreply.github.com
          commit_message: 'Deploy site build from ${{ github.sha }}'

      - name: Trigger Hostinger auto-deployment (optional)
        if: env.HOSTINGER_DEPLOY_WEBHOOK != ''
        run: curl -fsS -X POST "$HOSTINGER_DEPLOY_WEBHOOK"
